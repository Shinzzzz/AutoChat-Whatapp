# Local datastores for development. In production these are AWS RDS + ElastiCache.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: autochat
      POSTGRES_PASSWORD: autochat
      POSTGRES_DB: autochat
    ports:
      - "5432:5432"
    volumes:
      - autochat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autochat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - autochat_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autochat_pg:
  autochat_redis:
